<!DOCTYPE html>
<html>
<head>
    <title>Octopus Energy Agile Price</title>
</head>
<body>
    <h1>Octopus Energy Agile Price</h1>
    <div id="price"></div>
    <button onclick="getOctopusEnergyPrice()">Update Price</button>

    <script>
        function getOctopusEnergyPrice() {
            fetch('https://api.octopus.energy/v1/products/AGILE-18-02-28/electricity-tariffs/E-1R-AGILE-18-02-28-G/standard-unit-rates/')
                .then(response => response.json())
                .then(data => {
                    const price = data.data[0].value_inc_vat;
                    document.getElementById('price').innerHTML = `Current Octopus Energy Agile Price: £${price} per kWh`;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('price').innerHTML = 'Error fetching price data';
                });
        }

        // Fetch the price when the page loads
        getOctopusEnergyPrice();
    </script>
</body>
</html>
